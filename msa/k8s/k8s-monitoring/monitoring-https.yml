# monitoring-https.yml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: monitoring-renuvo-store-tls
  namespace: monitoring

spec:
  secretName: monitoring-renuvo-store-tls

  duration: 2160h
  renewBefore: 360h

  issuerRef:
    name: my-issuer
    kind: ClusterIssuer

  dnsNames:
    - prometheus.renuvo.store
    - grafana.renuvo.store