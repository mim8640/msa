# monitoring-Ingress.yml

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-ingress
  namespace: monitoring
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: my-issuer

spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - prometheus.renuvo.store
        - grafana.renuvo.store
      secretName: monitoring-renuvo-store-tls

  rules:
    - host: prometheus.renuvo.store
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus-service
                port:
                  number: 9090

    - host: grafana.renuvo.store
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000